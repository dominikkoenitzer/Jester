name: Release

# There are no version numbers — there is just Jester, and it is always the latest.
# Every push to main (or a manual run) rebuilds the portable single-file Windows
# build and refreshes the one rolling "latest" release.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# Never let two release runs race on the shared "latest" tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish latest
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Publish single-file (win-x64)
        run: >
          dotnet publish Jester.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      - name: Stage artifact
        shell: pwsh
        run: |
          $publish = "bin/Release/net9.0-windows/win-x64/publish/Jester.exe"
          if (-not (Test-Path $publish)) { throw "Expected build output not found: $publish" }
          Copy-Item $publish "Jester.exe"

      - name: Refresh the "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Replace the single rolling release so its tag points at this commit
          # and Jester.exe is the current build.
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Jester.exe \
            --title "Jester" \
            --notes "The latest build of Jester — a lightweight, themed notepad for Windows. Download **Jester.exe** below and run it; no installer, no .NET required." \
            --latest
