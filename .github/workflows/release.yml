name: Release

# There are no version numbers. There is just Jester, and it is always the latest.
# Every push to main (or a manual run) rebuilds the portable single-file Windows
# build and, once CI passed on that commit, refreshes the one rolling "latest"
# release.
on:
  push:
    branches: [ main ]
    # Only rebuild the release when something that affects the binary changes.
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: write

# Never let two release runs race on the shared "latest" tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # CI starts on the same push as this workflow, not before it, so without
  # this a release could ship a commit whose CI run then fails.
  ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    permissions:
      actions: read
    timeout-minutes: 60

    steps:
      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # CI may not be listed yet, as it starts on the same push.
          run=
          for _ in $(seq 30); do
            run=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --branch main --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "::error::CI never ran on $GITHUB_SHA from a push to main, so it is not published"
            exit 1
          fi
          echo "Waiting for CI run $run"
          while :; do
            state=$(gh run view "$run" --json status,conclusion --jq '.status + " " + .conclusion')
            [ "${state%% *}" = completed ] && break
            sleep 30
          done
          if [ "$state" != "completed success" ]; then
            echo "::error::CI run $run ended in ${state#* }, so $GITHUB_SHA is not published"
            exit 1
          fi

  release:
    name: Publish latest
    needs: ci
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # CI passed on this commit already (the ci job); this checks it again
      # on the runner that builds what ships.
      - name: Restore
        run: dotnet restore Jester.sln

      - name: Test
        run: dotnet test Jester.sln -c Release --verbosity normal

      - name: Verify formatting
        run: dotnet format Jester.sln --verify-no-changes --no-restore

      - name: Publish single-file (win-x64)
        run: >
          dotnet publish Jester.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      - name: Stage artifact
        shell: pwsh
        run: |
          $publish = "bin/Release/net10.0-windows/win-x64/publish/Jester.exe"
          if (-not (Test-Path $publish)) { throw "Expected build output not found: $publish" }
          Copy-Item $publish "Jester.exe"

      - name: Refresh the "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Refresh the single rolling release in place, so its tag points at
          # this commit and Jester.exe is the current build.
          notes="The latest build of Jester, a fast themed notepad for Windows. Download **Jester.exe** below and run it. No installer, no .NET required."

          if ! gh release view latest > /dev/null 2>&1; then
            gh release create latest Jester.exe \
              --target "$GITHUB_SHA" \
              --title "Jester" \
              --notes "$notes" \
              --latest
            exit 0
          fi

          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
            -f sha="$GITHUB_SHA" -F force=true --silent

          # Upload the new build under a second name, then swap it in, so the
          # direct Jester.exe link keeps working while the upload runs.
          cp Jester.exe Jester.next.exe
          gh release upload latest Jester.next.exe --clobber
          release="repos/$GITHUB_REPOSITORY/releases/tags/latest"
          old=$(gh api "$release" --jq '.assets[] | select(.name == "Jester.exe") | .id')
          new=$(gh api "$release" --jq '.assets[] | select(.name == "Jester.next.exe") | .id')
          if [ -n "$old" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old" --silent
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$new" -f name=Jester.exe --silent

          gh release edit latest --title "Jester" --notes "$notes" --latest
