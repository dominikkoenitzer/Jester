name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Allow only one concurrent run per ref; cancel stale runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & format
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      # The repository has both Jester.csproj and Jester.sln at its root, so every
      # command names the solution explicitly rather than relying on discovery.
      - name: Restore
        run: dotnet restore Jester.sln

      - name: Build (Release)
        run: dotnet build Jester.sln -c Release --no-restore

      # Covers the logic that does not need a window: find/replace, settings
      # persistence, and the command table. The WPF views are still manual.
      - name: Test
        run: dotnet test Jester.sln -c Release --no-build --verbosity normal

      - name: Verify formatting
        run: dotnet format Jester.sln --verify-no-changes --no-restore
